name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libwayland-dev libxkbcommon-dev xorg-dev \
            libgles2-mesa-dev libfreetype-dev
      - uses: mlugg/setup-zig@v2
      - name: Build portable binary
        run: |
          # Under LTO, CMake archives static libs with the compiler's own
          # llvm-ar/llvm-ranlib, which aren't installed on the runner.
          # Wrap zig's bundled archiver instead.
          mkdir -p "$RUNNER_TEMP/zig-tools"
          printf '#!/bin/sh\nexec zig ar "$@"\n'     > "$RUNNER_TEMP/zig-tools/ar"
          printf '#!/bin/sh\nexec zig ranlib "$@"\n' > "$RUNNER_TEMP/zig-tools/ranlib"
          chmod +x "$RUNNER_TEMP/zig-tools/ar" "$RUNNER_TEMP/zig-tools/ranlib"
          # zig cc also doesn't report Debian/Ubuntu multiarch lib dirs, so
          # find_library can't locate OpenGL/X11/Freetype there. Point it at them.
          cmake --preset publish \
            -DCMAKE_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu \
            -DCMAKE_C_COMPILER_AR="$RUNNER_TEMP/zig-tools/ar" \
            -DCMAKE_CXX_COMPILER_AR="$RUNNER_TEMP/zig-tools/ar" \
            -DCMAKE_C_COMPILER_RANLIB="$RUNNER_TEMP/zig-tools/ranlib" \
            -DCMAKE_CXX_COMPILER_RANLIB="$RUNNER_TEMP/zig-tools/ranlib"
          cmake --build build/Publish
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" build/Publish/prock --draft --generate-notes
