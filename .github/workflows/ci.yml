name: CI
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake clang clang-tidy \
            libwayland-dev libxkbcommon-dev xorg-dev \
            libgles2-mesa-dev libfreetype-dev
      - name: Configure
        run: cmake --preset debug
        env:
          CC: clang
          CXX: clang++
      - name: Build
        run: cmake --build build/Debug
      - name: Test
        run: ./build/Debug/prock_tests

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check formatting
        run: find src -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror
